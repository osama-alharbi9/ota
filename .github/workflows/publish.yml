# Publishes the server and console images. The dev branch deploys to the dev
# environment as :dev, and main deploys to production as :latest. See
# docs/environments.md.
name: publish

on:
  push:
    branches: [dev, main]
    paths:
      - 'server/**'
      - 'console/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: https://github.com/${{ github.repository }}/pkgs/container/ota-server
    strategy:
      fail-fast: false
      matrix:
        image: [server, console]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0 OR MIT
          tags: |
            ghcr.io/${{ github.repository_owner }}/ota-${{ matrix.image }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
            ghcr.io/${{ github.repository_owner }}/ota-${{ matrix.image }}:${{ github.sha }}
